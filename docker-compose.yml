services:
  postgres:
    image: postgres:18
    container_name: senda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: senda
      POSTGRES_PASSWORD: ${SENDA_DB_PASSWORD:?set SENDA_DB_PASSWORD in .env}
      POSTGRES_DB: senda
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - senda_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda -d senda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  senda_pg_data:
