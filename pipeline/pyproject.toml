[project]
name = "senda-pipeline"
version = "0.1.0"
description = "FIRMS hotspot ingest, sensor chain, harmonization and validation for Verner"
requires-python = ">=3.12"
authors = [{ name = "Goodmartian Labs" }]
license = "AGPL-3.0-only"
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=17",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "httpx>=0.27",
    "pygrib>=2.1.8",
    "scikit-learn>=1.9.1",
]

[project.scripts]
senda-pipeline = "senda_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senda_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
